<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:linear-gradient(180deg,#dfe9f3,#ffffff);
}

.container{
  width:100%;
  display:flex;
  justify-content:center;
  flex-wrap: wrap;
}

.weather-card{
  width:100%;
  max-width:420px;
  background:#ffffff;
  border-radius:35px;
  padding:25px 22px;
  box-shadow:
    0 10px 30px rgba(0,0,0,0.08),
    inset 0 1px 0 rgba(255,255,255,0.6);
}

/* Search Box */

.search-box{
  display:flex;
  gap:12px;
  margin-bottom:30px;
}

.search-box input{
  flex:1;
  height:52px;
  border:none;
  outline:none;
  border-radius:16px;
  padding:0 18px;
  background:#f5f7fb;
  font-size:16px;
  color:#333;
  box-shadow:inset 0 2px 5px rgba(0,0,0,0.05);
}

.search-box input::placeholder{
  color:#9aa4b2;
}

.search-box button{
  border:none;
  outline:none;
  padding:0 22px;
  border-radius:16px;
  background:linear-gradient(135deg,#45b7ff,#1d8fff);
  color:#fff;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  transition:0.3s ease;
  box-shadow:0 8px 18px rgba(33,150,243,0.3);
}

.search-box button:hover{
  transform:translateY(-2px);
}

/* Weather Info */

.weather-info{
  text-align:center;
}

/* Weather Image */

.weather-icon{
  width:180px;
  margin:10px auto 20px;
  display:block;
}

/* Temperature */

.temperature{
  font-size:90px;
  line-height:1;
  font-weight:800;
  color:#0f172a;
  margin-bottom:10px;
}

/* City */

.city{
  font-size:32px;
  font-weight:700;
  color:#1e293b;
  margin-bottom:8px;
}

/* Condition */

.condition{
  font-size:22px;
  color:#94a3b8;
  margin-bottom:30px;
  font-weight:500;
}

/* Detail Cards */

.details{
  display:flex;
  gap:15px;
  margin-top:25px;
}

.detail-box{
  flex:1;
  background:#f8fafc;
  border-radius:24px;
  padding:18px 12px;
  box-shadow:
    0 5px 15px rgba(0,0,0,0.04),
    inset 0 1px 0 rgba(255,255,255,0.8);
}

.detail-box h4{
  font-size:15px;
  color:#94a3b8;
  margin-bottom:10px;
  font-weight:500;
}

.detail-box p{
  font-size:22px;
  font-weight:700;
  color:#0f172a;
}

/* Forecast Section */

.forecast{
  margin-top:35px;
}

.forecast-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.forecast-header h3{
  font-size:24px;
  color:#111827;
}

.forecast-header span{
  font-size:15px;
  color:#94a3b8;
}

/* Forecast Cards */

.forecast-cards{
  display:flex;
  gap:14px;
  overflow-x:auto;
  padding-bottom:8px;
}

.forecast-cards::-webkit-scrollbar{
  display:none;
}

.forecast-card{
  min-width:90px;
  background:#f5f7fb;
  border-radius:28px;
  padding:18px 12px;
  text-align:center;
  transition:0.3s ease;
}

.forecast-card.active{
  background:linear-gradient(180deg,#53bfff,#2196f3);
  color:#fff;
  box-shadow:0 10px 25px rgba(33,150,243,0.35);
}

.forecast-card img{
  width:42px;
  margin:10px 0;
}

.forecast-card h4{
  font-size:28px;
  margin-bottom:10px;
}

.forecast-card p{
  font-size:15px;
  color:inherit;
}

/* Responsive */

@media(max-width:768px){

  .weather-card{
    max-width:95%;
    border-radius:30px;
  }

  .temperature{
    font-size:75px;
  }

  .city{
    font-size:28px;
  }

  .condition{
    font-size:20px;
  }
}

@media(max-width:480px){

  body{
    padding:12px;
  }

  .weather-card{
    padding:20px 16px;
    border-radius:28px;
  }

  .search-box{
    flex-direction:column;
  }

  .search-box button{
    height:50px;
  }

  .weather-icon{
    width:150px;
  }

  .temperature{
    font-size:65px;
  }

  .city{
    font-size:24px;
  }

  .condition{
    font-size:18px;
  }

  .details{
    flex-direction:column;
  }

  .detail-box{
    width:100%;
  }

  .forecast-card{
    min-width:80px;
  }
}
      </style>
</head>
<body>
    




    <div class="container">
      <div class="weather-card">
        <div class="search-box">
          <input type="text" id="city" placeholder="Enter city name">
          <button id="weatherBtn">Search</button>
        </div>
    
        <div class="weather-info">
    
          
    
      </div>
    </div>
    


    <script src="app.js"></script>
</body>
</html>
